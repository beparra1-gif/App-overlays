name: app-overlays-backend
services:
- github:
    branch: main
    repo: tu-usuario/App-overlays
    build_command: npm install
    run_command: npm start
  http_port: 3000
  name: api
  source_dir: backend
  health_check:
    http_path: /api/health
  envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: JWT_SECRET
    value: ""
  - key: FRONTEND_URL
    value: ""
  - key: GOOGLE_CLIENT_ID
    value: ""
  - key: RESEND_API_KEY
    value: ""
  - key: EMAIL_FROM
    value: "App-overlays <onboarding@resend.dev>"

databases:
- engine: PG
  name: db
  production: true
  version: "15"
  size: db-s-1vcpu-1gb
